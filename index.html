<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chairside</title>
<meta name="theme-color" content="#1F5C4A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chairside">
<style>
:root{--bg:#F3F1EC;--card:#fff;--ink:#1B1E1C;--muted:#6B6F6A;--line:#E6E2D9;--accent:#1F5C4A;--accent-ink:#fff;--accent-soft:#E2EEE8;--brass:#A9762A;--brass-soft:#F5EBD8;--red:#B3412E;--red-soft:#F7E4E0;--green:#1D7A4C;--green-soft:#E1F1E8;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#111412;--card:#1B1F1D;--ink:#ECEDEA;--muted:#9AA09A;--line:#2B302D;--accent:#3E9B7C;--accent-ink:#06120D;--accent-soft:#1D2F28;--brass:#D9A653;--brass-soft:#2E2618;--red:#E2735F;--red-soft:#3A221D;--green:#55C38A;--green-soft:#183026;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
h1{font-size:20px;margin:0;letter-spacing:-.01em;line-height:1.2}
h2{font-size:18px;margin:0}
h3{font-size:22px;margin:4px 0 16px}
.sub{color:var(--muted);font-size:14px}
main{padding:0 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid2 .card{margin:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.big.xl{font-size:40px}
.green{color:var(--green)}.red{color:var(--red)}
.center{text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--brass-soft);color:var(--brass);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.day{min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.day span{font-size:11px;color:var(--muted);white-space:nowrap}.day b{font-size:18px}.day i{font-style:normal;font-size:11px;font-weight:700;color:var(--brass);height:14px}
.day.past{opacity:.6}.day.now{border-color:var(--accent)}
.day.on{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}.day.on span,.day.on i{color:var(--bg)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px 6px;cursor:pointer}
.tiny{font-size:11px;font-weight:600}
.sub.red{color:var(--red)}
.svcedit{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.svcedit label{margin-bottom:0}
body.locked nav,body.locked header{display:none}
.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 0 20px;max-width:420px;margin:0 auto}
.login h1{font-size:28px;margin:10px 0 0}
.logo.big{width:64px;height:64px;border-radius:20px;font-size:30px}
.login .answer{margin-top:12px}
.next{border:2px solid var(--accent);cursor:pointer}
.next .nm{font-size:24px;font-weight:800}.next .nt{font-size:30px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.sec{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 2px 10px;gap:10px}
.rowc{display:flex;align-items:center;gap:14px;cursor:pointer;padding:14px 16px;border-left:4px solid var(--accent)}
.rowc.done{border-left-color:var(--green);opacity:.75}.rowc.noshow{border-left-color:var(--red);opacity:.6}
.rt{font-size:18px;font-weight:800;min-width:54px;font-variant-numeric:tabular-nums}
.rm{flex:1;min-width:0}.nm{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pr{font-weight:800;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--green-soft);color:var(--green)}.pill.bad{background:var(--red-soft);color:var(--red)}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;flex:none}
.ic.in{background:var(--green-soft);color:var(--green)}.ic.out{background:var(--red-soft);color:var(--red)}
.rowc.tx{border-left:1px solid var(--line)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font-weight:700;color:var(--accent);cursor:pointer;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.full{width:100%;margin-top:6px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost.danger{color:var(--red)}
.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.icon{width:44px;height:44px;padding:0;font-size:22px;line-height:1}
.btn:disabled{opacity:.35}
.banner .btn{background:var(--card);color:var(--brass)}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:11px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.breakdown{background:var(--bg);border-radius:14px;padding:12px 14px;margin:12px 0}
.breakdown div,.mini div{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}
.breakdown span,.mini span{color:var(--muted)}
.breakdown .tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-size:17px}
.breakdown .tot span{color:var(--ink);font-weight:700}
.mini{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
input,select{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.check{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:16px}
label.check input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.erow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.erow input,.erow select{margin:0}
.erow .num{width:84px;flex:none}
label.inl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
label.inl input{width:110px;margin:0}
.staffedit{padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin-bottom:16px}.kv span{color:var(--muted)}.kv b{text-align:right}
.kv a{color:var(--accent)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:20px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:end;max-width:100%}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
nav .mic{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin:-28px auto 0;justify-content:center;box-shadow:0 6px 20px rgba(31,92,74,.35)}
nav .mic svg{width:28px;height:28px}
.sheet{position:fixed;inset:0;z-index:20;visibility:hidden}
.sheet.open{visibility:visible}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .2s}
.sheet.open .sheet-bg{opacity:1}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.open .sheet-card{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 6px}
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:12px;border:0;background:var(--line);font-size:22px;cursor:pointer}
.micbig{display:grid;place-items:center;width:120px;height:120px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);margin:8px auto 14px;cursor:pointer;box-shadow:0 10px 30px rgba(31,92,74,.3)}
.micbig svg{width:46px;height:46px}
.micbig.live{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,65,46,.5)}100%{box-shadow:0 0 0 24px rgba(179,65,46,0)}}
.answer{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 14px;margin:14px 0 0;font-weight:600}
.cmdrow{display:flex;gap:8px;margin-top:16px}.cmdrow input{margin:0}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">C</div>
  <div><h1 id="shopName">Chairside</h1><div class="sub" id="todayLabel"></div></div>
</header>
<main id="view"></main>
<nav>
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Today</button>
  <button data-act="tab" data-tab="till"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>Till</button>
  <button class="mic" data-act="voice" aria-label="Voice command"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button data-act="tab" data-tab="staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Staff</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="7" cy="18" r="2" fill="currentColor"/></svg>Settings</button>
</nav>
<div class="sheet" id="sheet"><div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const weekStart=s=>{const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);};
const monthRange=s=>{const d=parseYmd(s);return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];};
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const eur=n=>{n=Math.round((+n||0)*100)/100;const neg=n<0;n=Math.abs(n);return(neg?'−':'')+'€'+n.toLocaleString('en-IE',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});};
const fmtDay=s=>parseYmd(s).toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'});
const short=s=>parseYmd(s).toLocaleDateString('en-IE',{day:'numeric',month:'short'});

/* ---------- data ---------- */
const KEY='chairside-v1';
let S;
function baseData(){return{shop:'My Barbershop',hours:{open:'09:00',close:'19:00',slot:30},voiceReply:true,demo:false,
  services:[{id:'s1',name:'Haircut',price:20,dur:30},{id:'s2',name:'Skin fade',price:25,dur:45},{id:'s3',name:'Beard trim',price:12,dur:15},{id:'s4',name:'Hair + Beard',price:30,dur:45},{id:'s5',name:'Kids cut',price:15,dur:20},{id:'s6',name:'Hot towel shave',price:20,dur:30}],
  staff:[{id:'me',name:'Me',pay:'owner',rate:0,wage:0}],bookings:[],tx:[]};}
function sampleData(){
  const d=baseData();d.demo=true;d.shop='Fade Street Barbers';
  d.staff.push({id:'sam',name:'Sam',pay:'both',rate:20,wage:350});
  const T=today(),ws=weekStart(T),svc=id=>d.services.find(s=>s.id===id);
  const mk=(date,time,name,sid,staff,status,paid)=>{const s=svc(sid);const b={id:uid(),date,time,walkin:!time,name,serviceId:sid,staffId:staff,price:s.price,dur:s.dur,status,created:Date.now()+d.bookings.length};
    if(status==='done'){b.paidBy=paid;d.tx.push({id:uid(),date,time:time||'12:00',type:'in',amount:s.price,method:paid,note:`${name} · ${s.name}`,kind:'service',bookingId:b.id,staffId:staff});}
    d.bookings.push(b);};
  const past=['Conor Byrne','Seán Murphy','Darragh Kelly','Cian Walsh','Adam Nolan','Fionn Ryan','Eoin Daly','Luke Kavanagh','Mark Doyle','Tadhg Burke','Niall Quinn','Rory Moran'];
  let k=0;
  for(let ds=ws;ds<T;ds=addDays(ds,1))['10:00','11:30','14:00','16:30'].forEach((tm,i)=>mk(ds,tm,past[k++%past.length],['s2','s1','s4','s5'][i],i%2?'sam':'me','done',i%3?'card':'cash'));
  [['09:30','Liam Walsh','s2','me'],['10:00','Jack Doyle','s1','sam'],['11:00',"Cian O'Brien",'s4','me'],['12:30','Adam Ryan','s5','sam'],['14:00','Oisín Nolan','s2','me'],['15:30','Fionn Daly','s3','sam'],['16:30','Eoin Kavanagh','s1','me'],['17:30','Luke Byrne','s4','sam']]
    .forEach(([tm,n,sid,st])=>mk(T,tm,n,sid,st,'waiting'));
  mk(T,null,'Ryan Murphy','s1','me','waiting');mk(T,null,'Darragh Kelly','s2','sam','waiting');
  [['10:00','Paddy Walsh','s2','me'],['13:00','Kevin Byrne','s4','sam'],['15:00','Shane Kelly','s1','me']].forEach(([tm,n,sid,st])=>mk(addDays(T,1),tm,n,sid,st,'waiting'));
  d.tx.push({id:uid(),date:ws,time:'18:00',type:'out',amount:50,method:'cash',note:'Sam · Advance',kind:'advance',staffId:'sam'});
  d.tx.push({id:uid(),date:addDays(T,-1)>=ws?addDays(T,-1):T,time:'13:15',type:'out',amount:38,method:'card',note:'Clipper oil & blades',kind:'expense'});
  return d;}
// Fill in anything older saved data (or an old backup) is missing, so nothing breaks after an update.
function migrate(o){
  const d=Object.assign(baseData(),o);
  d.hours=Object.assign(baseData().hours,d.hours||{});
  const guess=n=>/beard|trim/i.test(n)&&!/hair|cut/i.test(n)?15:/kid|child/i.test(n)?20:/fade|\+|and/i.test(n)?45:30;
  d.services.forEach(s=>{if(!(+s.dur>0))s.dur=guess(s.name||'');s.price=+s.price||0;});
  d.bookings.forEach(b=>{if(!b.walkin&&!(+b.dur>0)){const s=d.services.find(x=>x.id===b.serviceId);b.dur=s?s.dur:30;}});
  if(!d.staff.length)d.staff=baseData().staff;
  return d;}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=migrate(JSON.parse(r));if(S.demo&&!S.acct){S=baseData();}return;}}catch(e){}S=baseData();}
const hasSync=()=>typeof Sync!=='undefined';
function save(){if(hasSync())Sync.stamp();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Could not save on this device');}if(hasSync())Sync.changed();}

const svcById=id=>S.services.find(s=>s.id===id);
const staffById=id=>S.staff.find(s=>s.id===id);
const svcName=b=>{const s=svcById(b.serviceId);return s?s.name:'Service';};
const staffTag=b=>{if(S.staff.length<2)return'';const s=staffById(b.staffId);return s?' · '+esc(s.name):'';};
const durOf=b=>+b.dur||+(svcById(b.serviceId)||{}).dur||+S.hours.slot||30;
const durTxt=m=>m<60?m+' min':Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'m':'');
const DURS=[5,10,15,20,25,30,35,40,45,50,55,60,75,90,105,120,150,180];
const durOptions=sel=>{const list=DURS.includes(+sel)?DURS:[...DURS,+sel].sort((a,b)=>a-b);return list.map(m=>`<option value="${m}" ${m===+sel?'selected':''}>${durTxt(m)}</option>`).join('');};
// Bookings for one barber that overlap a time window (minutes from midnight).
function clashes(date,staffId,start,dur,excludeId){
  return S.bookings.filter(b=>b.id!==excludeId&&b.date===date&&b.staffId===staffId&&!b.walkin&&b.time&&b.status!=='noshow')
    .filter(b=>{const s=toMin(b.time);return s<start+dur&&start<s+durOf(b);});}
const freeStaff=(date,start,dur,excludeId)=>S.staff.filter(s=>!clashes(date,s.id,start,dur,excludeId).length);
const inHours=(start,dur)=>start>=toMin(S.hours.open)&&start+dur<=toMin(S.hours.close);
// Every 15 minutes from 05:00 to 23:45, for opening-hour pickers.
const QUARTERS=Array.from({length:76},(_,i)=>fromMin(300+i*15));

function staffCalc(st,ws){
  const we=addDays(ws,6);
  const done=S.bookings.filter(b=>b.status==='done'&&b.staffId===st.id&&b.date>=ws&&b.date<=we);
  const rev=sum(done.map(b=>b.price));
  const comm=(st.pay==='commission'||st.pay==='both')?rev*(+st.rate||0)/100:0;
  const wage=(st.pay==='wage'||st.pay==='both')?(+st.wage||0):0;
  const payments=S.tx.filter(x=>x.staffId===st.id&&x.type==='out'&&x.date>=ws&&x.date<=we);
  const paid=sum(payments.map(x=>x.amount));
  return{done,rev,earned:comm+wage,paid,left:comm+wage-paid,payments};}

/* ---------- Today ---------- */
function freeSlots(d){
  const T=today();if(d<T)return[];
  const o=toMin(S.hours.open),c=toMin(S.hours.close),st=+S.hours.slot||30,nm=d===T?toMin(nowHM()):-1,out=[];
  for(let m=o;m+st<=c;m+=st){if(m<nm)continue;if(freeStaff(d,m,st).length)out.push(fromMin(m));}
  return out;}
function rowHtml(b,left){
  const st={waiting:['waiting','pill'],done:['paid · '+(b.paidBy||''),'pill ok'],noshow:['no-show','pill bad']}[b.status];
  const end=!b.walkin&&b.time?`<div class="sub tiny">–${fromMin(toMin(b.time)+durOf(b))}</div>`:'';
  return`<div class="card rowc ${b.status}" data-act="openBooking" data-id="${b.id}"><div class="rt">${esc(left)}${end}</div><div class="rm"><div class="nm">${esc(b.name)}</div><div class="sub">${esc(svcName(b))}${b.walkin?'':' · '+durTxt(durOf(b))}${staffTag(b)}</div></div><div class="rr"><div class="pr">${eur(b.price)}</div><span class="${st[1]}">${st[0]}</span></div></div>`;}
function viewToday(){
  const d=UI.date,T=today();
  const list=S.bookings.filter(b=>b.date===d);
  const timed=list.filter(b=>!b.walkin).sort((a,b)=>a.time.localeCompare(b.time));
  const walk=list.filter(b=>b.walkin).sort((a,b)=>(a.status==='waiting'?0:1)-(b.status==='waiting'?0:1)||a.created-b.created);
  const live=list.filter(b=>b.status!=='noshow');
  const inn=S.tx.filter(x=>x.date===d&&x.type==='in');
  const cash=sum(inn.filter(x=>x.method==='cash').map(x=>x.amount)),card=sum(inn.filter(x=>x.method==='card').map(x=>x.amount));
  const ws=weekStart(d),we=addDays(ws,6),thisWeek=ws===weekStart(T);
  const wlabel=thisWeek?'This week':ws===addDays(weekStart(T),7)?'Next week':short(ws)+' – '+short(we);
  let h=`<div class="navrow"><button class="btn icon ghost" data-act="weekPrev" aria-label="Previous week">‹</button><div class="center"><b>${wlabel}</b>${d!==T?`<div><button class="linkbtn" data-act="goToday">Back to today</button></div>`:''}</div><button class="btn icon ghost" data-act="weekNext" aria-label="Next week">›</button></div><div class="week">`;
  for(let i=0;i<7;i++){const ds=addDays(ws,i),dd=parseYmd(ds),n=S.bookings.filter(b=>b.date===ds&&b.status!=='noshow').length;
    h+=`<button class="day ${ds===d?'on':''} ${ds===T?'now':''} ${ds<T?'past':''}" data-act="pickDay" data-d="${ds}"><span>${ds===T?'Today':dd.toLocaleDateString('en-IE',{weekday:'short'})}</span><b>${dd.getDate()}</b><i>${n?(n>9?'9+':n):''}</i></button>`;}
  h+='</div>';
  h+=`<div class="grid2"><div class="card"><div class="label">${d===T?'Today':fmtDay(d)}</div><div class="big">${live.length}</div><div class="sub">${live.filter(b=>b.status==='done').length} done · ${live.filter(b=>b.status==='waiting').length} waiting</div></div>
  <div class="card"><div class="label">Taken</div><div class="big green">${eur(cash+card)}</div><div class="sub">Cash ${eur(cash)} · Card ${eur(card)}</div></div></div>`;
  if(d===T){
    const nm=toMin(nowHM()),next=timed.find(b=>b.status==='waiting'&&toMin(b.time)>=nm-20);
    if(next)h+=`<div class="card next" data-act="openBooking" data-id="${next.id}"><div class="label">Next up</div><div class="row"><div style="min-width:0"><div class="nm">${esc(next.name)}</div><div class="sub">${esc(svcName(next))}${staffTag(next)}</div></div><div class="nt">${next.time}</div></div></div>`;
    const wq=walk.filter(b=>b.status==='waiting').length;
    h+=`<div class="sec"><div><h2>Walk-ins</h2><div class="sub">${wq?wq+' waiting':'Nobody waiting'}</div></div><button class="btn sm ghost" data-act="newWalkin">+ Walk-in</button></div>`;
    let q=0;walk.forEach(b=>h+=rowHtml(b,b.status==='waiting'?'#'+(++q):'✓'));
  }
  h+=`<div class="sec"><div><h2>Bookings</h2><div class="sub">${timed.length} booked</div></div><button class="btn sm" data-act="newBooking">+ Booking</button></div>`;
  if(!timed.length)h+='<div class="card empty">No bookings for this day.</div>';
  timed.forEach(b=>h+=rowHtml(b,b.time));
  const fs=freeSlots(d);
  if(d>=T)h+=`<div class="sec"><div><h2>Free times</h2><div class="sub">Tap one to book</div></div></div><div class="slots">${fs.map(s=>`<button class="slot" data-act="newBooking" data-time="${s}">${s}</button>`).join('')||'<div class="sub">No free times left.</div>'}</div>`;
  return h;}

    const times=[];for(let m=o;m<c;m+=step)times.push(fromMin(m));
    if(keep&&!times.includes(keep))times.push(keep),times.sort();

      return`<option value="${t}" ${t===keep?'selected':''}>${t}${busy?' · busy':late?' · after closing':''}</option>`;}).join('');
    hint();};

  ['#f_date','#f_dur','#f_staff'].forEach(sel=>{const el=$(sel);if(el)el.onchange=()=>fillTimes($('#f_time').value);});

function saveBooking(id){

    date:$('#f_date').value||today(),time:walk?null:time,walkin:walk,price,dur:+$('#f_dur').value||30};
  if(!walk){const cl=clashes(data.date,data.staffId,toMin(time),data.dur,id);

  if(id)Object.assign(S.bookings.find(b=>b.id===id),data);

function payBooking(id,m){

/* ---------- Till ---------- */
function tillRange(){const m=UI.tillMode,d=UI.tillDate;if(m==='day')return[d,d];if(m==='week'){const s=weekStart(d);return[s,addDays(s,6)];}return monthRange(d);}
function tillLabel(){const[s,e]=tillRange(),T=today();
  if(UI.tillMode==='day')return s===T?'Today':s===addDays(T,-1)?'Yesterday':fmtDay(s);
  if(UI.tillMode==='week')return(s<=T&&T<=e?'This week · ':'')+short(s)+' – '+short(e);
  return parseYmd(s).toLocaleDateString('en-IE',{month:'long',year:'numeric'});}
function shiftTill(dir){const m=UI.tillMode;if(m==='day')UI.tillDate=addDays(UI.tillDate,dir);else if(m==='week')UI.tillDate=addDays(UI.tillDate,7*dir);else{const d=parseYmd(UI.tillDate);UI.tillDate=ymd(new Date(d.getFullYear(),d.getMonth()+dir,1));}render();}
function viewTill(){
  const[s,e]=tillRange();
  const tx=S.tx.filter(x=>x.date>=s&&x.date<=e).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const inn=tx.filter(x=>x.type==='in'),out=tx.filter(x=>x.type==='out');
  const ti=sum(inn.map(x=>x.amount)),to=sum(out.map(x=>x.amount));
  const cash=sum(inn.filter(x=>x.method==='cash').map(x=>x.amount)),cashOut=sum(out.filter(x=>x.method==='cash').map(x=>x.amount));
  let h=`<div class="seg">${['day','week','month'].map(m=>`<button data-act="tillMode" data-m="${m}" class="${UI.tillMode===m?'on':''}">${cap(m)}</button>`).join('')}</div>
  <div class="navrow"><button class="btn icon ghost" data-act="tillPrev" aria-label="Previous">‹</button><b>${tillLabel()}</b><button class="btn icon ghost" data-act="tillNext" aria-label="Next" ${e>=today()?'disabled':''}>›</button></div>
  <div class="card center"><div class="label">Left after costs</div><div class="big xl ${ti-to<0?'red':'green'}">${eur(ti-to)}</div><div class="sub">${eur(ti)} in − ${eur(to)} out</div></div>
  <div class="grid2"><div class="card"><div class="label">In</div><div class="big green">${eur(ti)}</div><div class="sub">Cash ${eur(cash)} · Card ${eur(ti-cash)}</div></div><div class="card"><div class="label">Out</div><div class="big red">${eur(to)}</div><div class="sub">${out.length?out.length+' payment'+(out.length>1?'s':''):'No costs'}</div></div></div>
  <div class="card row"><span class="sub">Cash that should be in the drawer</span><b>${eur(cash-cashOut)}</b></div>
  <div class="grid2"><button class="btn green" data-act="moneyIn">+ Money in</button><button class="btn red" data-act="moneyOut">− Money out</button></div>
  <div class="sec"><h2>Transactions</h2><div class="sub">${tx.length}</div></div>`;
  if(!tx.length)h+='<div class="card empty">Nothing recorded for this period.</div>';
  tx.forEach(x=>h+=`<div class="card rowc tx" data-act="openTx" data-id="${x.id}"><div class="ic ${x.type}">${x.type==='in'?'↓':'↑'}</div><div class="rm"><div class="nm">${esc(x.note||(x.type==='in'?'Money in':'Money out'))}</div><div class="sub">${UI.tillMode==='day'?'':fmtDay(x.date)+' · '}${x.time} · ${x.method}</div></div><div class="pr ${x.type==='in'?'green':'red'}">${x.type==='in'?'+':'−'}${eur(x.amount)}</div></div>`);
  return h;}

/* ---------- Command parser (English, rule-based, free) ---------- */
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function wordsToNums(s){
  return s.replace(/\b(twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)[\s-](one|two|three|four|five|six|seven|eight|nine)\b/g,(m,a,b)=>NUMW[a]+NUMW[b])
    .replace(/\b(a|one) hundred\b/g,'100')
    .replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)\b/g,m=>NUMW[m]);}
const STOP=new Set(("book booking booked add put in walk walkin walkins ins for at a an the with on today tomorrow tonight am pm oclock o'clock half past quarter to and please appointment customer new him her his he she just is has was it its tap tapped done finished gave give pays pay paid cash card euro euros quid "+
  "haircut cut trim fade skin beard kids kid child shave hot towel hair wash me my i got get did do by of up from mins minutes monday tuesday wednesday thursday friday saturday sunday next week this that there here can you some want wants yeah ok okay now").split(' '));
const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const ALIAS=[[/\b(kids?|child|children|boys?)\b/,'kid'],[/\b(hair|cut|haircut) ?(and|&|\+|n) ?beard\b|\bfull works\b/,'hair + beard'],[/\bfade\b/,'fade'],[/\bshave\b/,'shave'],[/\bbeard\b/,'beard'],[/\b(haircut|hair cut|cut|trim)\b/,'haircut']];
function findService(t){
  let best=null;
  for(const s of S.services){const n=s.name.toLowerCase();if(t.includes(n)&&(!best||n.length>best.name.length))best=s;}
  if(best)return best;
  for(const[re,key]of ALIAS)if(re.test(t)){const s=S.services.find(x=>x.name.toLowerCase().includes(key));if(s)return s;}
  return null;}
const wordIn=(t,w)=>new RegExp('(^|\\s)'+escRe(w)+'(\\s|$)').test(t);
function findStaff(t){return S.staff.find(s=>s.name.toLowerCase()!=='me'&&wordIn(t,s.name.toLowerCase().split(' ')[0]));}
function findName(t,ex,staff){
  const sw=staff?staff.name.toLowerCase().split(/\s+/):[];
  const w=t.replace(/[^a-z'áéíóú\s-]/g,' ').split(/\s+/).filter(x=>x&&x.length>1&&!STOP.has(x)&&!ex.has(x)&&!sw.includes(x));
  return w.slice(0,2).map(x=>x.split(/(['-])/).map(cap).join('')).join(' ');}
function fixH(h,mi,ap){
  ap=(ap||'').replace(/[\s.]/g,'');

  // No am/pm said: "at 3" in a barbershop means 3 pm, but "at 8" with an 8 pm close still means 8 am.
  else if(ap!=='am'&&ap!=='pm'){const oh=Math.floor(toMin(S.hours.open)/60);if(h<oh&&h<12&&(h+12)*60+mi<toMin(S.hours.close))h+=12;}
  if(h>23||mi>59)return null;return fromMin(h*60+mi);}
function findTime(t,bare){
  const tries=[[/\bhalf (?:past )?(\d{1,2})\b/,m=>fixH(+m[1],30)],[/\bquarter past (\d{1,2})\b/,m=>fixH(+m[1],15)],[/\bquarter to (\d{1,2})\b/,m=>fixH(+m[1]-1,45)],
    [/\b(\d{1,2})[:.](\d{2})\s*(am|pm)?\b/,m=>fixH(+m[1],+m[2],m[3])],[/\b(\d{1,2})\s*(am|pm|o'?clock)\b/,m=>fixH(+m[1],0,m[2])],[/\bat (\d{1,2})\b/,m=>fixH(+m[1],0)]];

  if(/\btomorrow\b/.test(t))return{d:addDays(T,1),label:'tomorrow'};
  for(let i=0;i<7;i++)if(new RegExp('\\b'+DAYS[i]+'\\b').test(t)){let diff=(i-parseYmd(T).getDay()+7)%7||7;return{d:addDays(T,diff),label:'on '+cap(DAYS[i])};}

// Pick a barber: someone free at that time if possible, then whoever has the fewest customers that day.
function leastBusy(d,time,dur){

  let best=pool[0],bc=1e9;for(const s of pool){const c=S.bookings.filter(b=>b.date===d&&b.staffId===s.id&&b.status==='waiting').length;if(c<bc){bc=c;best=s;}}return best;}
const firstNum=t=>{const m=t.match(/\b(\d+(?:\.\d{1,2})?)\b/);return m?parseFloat(m[1]):null;};

function runCommand(raw){
  let t=' '+raw.toLowerCase().replace(/[’‘]/g,"'").replace(/€\s*/g,' euro ').replace(/(\d),(\d{3})/g,'$1$2').replace(/\bp\.?\s?m\.?/g,'pm').replace(/\ba\.\s?m\.?/g,'am').replace(/[!?;,"“”]/g,' ')+' ';
  t=wordsToNums(t).replace(/(\D)\.(\s|$)/g,'$1 ').replace(/\s+/g,' ');
  const T=today(),has=re=>re.test(t);
  let amount=null,m;
  if((m=t.match(/\beuros? (\d+(?:\.\d{1,2})?)\b/))||(m=t.match(/\b(\d+(?:\.\d{1,2})?) ?(?:euros?|quid|bucks)\b/))){amount=parseFloat(m[1]);t=t.replace(m[0],' ');}

  // questions
  if(has(/\b(owe|owed|owing)\b/)){const list=staff?[staff]:S.staff.filter(s=>s.pay!=='owner');if(!list.length)return reply('You have no staff set up yet.');

  if(has(/\b(how much|takings|taken|made|earned|so far)\b/)&&amount===null&&!has(/\d/)){
    const wk=has(/\bweek\b/),mo=has(/\bmonth\b/),r=wk?[weekStart(T),addDays(weekStart(T),6)]:mo?monthRange(T):[T,T];
    const tx=S.tx.filter(x=>x.date>=r[0]&&x.date<=r[1]),i=sum(tx.filter(x=>x.type==='in').map(x=>x.amount)),o=sum(tx.filter(x=>x.type==='out').map(x=>x.amount));
    return reply(`You've taken ${eur(i)} ${wk?'this week':mo?'this month':'today'}${o?`, with ${eur(o)} out, leaving ${eur(i-o)}`:''}.`);}
  if(has(/\b(who'?s next|who is next|next customer|next up|next booking)\b/)){
    const nm=toMin(nowHM()),wq=S.bookings.filter(b=>b.date===T&&b.walkin&&b.status==='waiting').sort((a,b)=>a.created-b.created);
    const nx=S.bookings.filter(b=>b.date===T&&!b.walkin&&b.status==='waiting'&&toMin(b.time)>=nm-20).sort((a,b)=>a.time.localeCompare(b.time))[0];
    let msg=nx?`Next is ${nx.name} at ${nx.time} for a ${svcName(nx).toLowerCase()}.`:'No more bookings today.';
    if(wq.length)msg+=` ${wq.length} walk-in${wq.length>1?'s':''} waiting, first is ${wq[0].name}.`;return reply(msg);}

  // staff advance / pay

    return reply(`${kind==='advance'?'Advance':'Payment'} of ${eur(num)} to ${staff.name} recorded.`);}
  if(has(/\badvance\b/))return reply('Which barber? Say their name, like "give Sam 50 advance".');

  // sale (money in)
  if(has(/\b(sold|sale)\b/)){const num=amount??firstNum(t);if(!num)return reply('How much was the sale?');
    const note=t.replace(/\d+(\.\d+)?/g,' ').split(/\s+/).filter(x=>x&&!['sold','sale','a','an','the','of','for','cash','card','euro','euros','i'].includes(x)).join(' ');
    const meth=has(/\b(card|tap)\b/)?'card':'cash';addTx('in',num,meth,note?cap(note):'Sale','other');render();return reply(`${eur(num)} ${meth} sale recorded.`);}

  // expense (money out)
  if(has(/\b(spent|spend|expense|bill|bought|buy|rent|electricity|electric|supplies|stock)\b/)){
    const num=amount??firstNum(t);if(!num)return reply('How much was it?');
    const note=t.replace(/\d+(\.\d+)?/g,' ').split(/\s+/).filter(x=>x&&!['spent','spend','on','for','expense','bill','bought','buy','paid','pay','the','a','an','euro','euros','cash','card','i','of','some','new','just','we'].includes(x)).join(' ')||'Expense';

  const svc=findService(t);

  // walk-in

  let tm=findTime(t);

    const nameW=findName(t,svcWords,staff),meth=has(/\b(card|tap|tapped|revolut)\b/)?'card':'cash';

  if(amount!==null&&!tm){const meth=has(/\bcard\b/)?'card':'cash';addTx('in',amount,meth,svc?svc.name:'Money in','other');render();return reply(`${eur(amount)} by ${meth} recorded.`);}

const ACT={
  tab:el=>{UI.tab=el.dataset.tab;if(UI.tab==='today'&&UI.date<today())UI.date=today();render();window.scrollTo(0,0);},
  pickDay:el=>{UI.date=el.dataset.d;render();},
  weekPrev:()=>{UI.date=addDays(UI.date,-7);render();},
  weekNext:()=>{UI.date=addDays(UI.date,7);render();},
  goToday:()=>{UI.date=today();render();},
  newBooking:el=>bookingForm(null,{time:el.dataset.time||''}),
  newWalkin:()=>bookingForm(null,{walkin:true}),
  saveBooking:(el,id)=>saveBooking(id),
  openBooking:(el,id)=>bookingDetail(id),
  pay:(el,id)=>{payBooking(id,el.dataset.m);closeSheet();render();toast('Paid ✓');},
  noshow:(el,id)=>{const b=S.bookings.find(x=>x.id===id);if(b){b.status='noshow';save();}closeSheet();render();},
  undo:(el,id)=>{const b=S.bookings.find(x=>x.id===id);if(!b)return;S.tx=S.tx.filter(x=>x.bookingId!==id);b.status='waiting';b.paidBy=null;save();closeSheet();render();},
  editBooking:(el,id)=>bookingForm(S.bookings.find(x=>x.id===id)),
  delBooking:(el,id)=>{if(!confirm('Delete this booking?'))return;S.bookings=S.bookings.filter(x=>x.id!==id);S.tx=S.tx.filter(x=>x.bookingId!==id);save();closeSheet();render();},
  tillMode:el=>{UI.tillMode=el.dataset.m;UI.tillDate=today();render();},
  tillPrev:()=>shiftTill(-1),tillNext:()=>shiftTill(1),
  moneyIn:()=>moneyForm('in'),moneyOut:()=>moneyForm('out'),
  saveMoney:el=>{const type=el.dataset.t,a=parseFloat($('#m_amt').value);if(!(a>0))return toast('Enter an amount');
    addTx(type,a,$('#m_meth .on').dataset.m,$('#m_note').value.trim()||(type==='in'?'Money in':'Expense'),type==='in'?'other':'expense');closeSheet();render();toast('Saved');},
  openTx:(el,id)=>txDetail(id),
  delTx:(el,id)=>{if(!confirm('Delete this transaction?'))return;const x=S.tx.find(t=>t.id===id);if(x&&x.bookingId){const b=S.bookings.find(b=>b.id===x.bookingId);if(b){b.status='waiting';b.paidBy=null;}}S.tx=S.tx.filter(t=>t.id!==id);save();closeSheet();render();},
  wkPrev:()=>{UI.staffWeek=addDays(UI.staffWeek,-7);render();},wkNext:()=>{UI.staffWeek=addDays(UI.staffWeek,7);render();},
  staffPay:(el,id)=>staffPayForm(id,el.dataset.k),saveStaffPay:(el,id)=>saveStaffPay(id,el.dataset.k),
  addSvc:()=>{S.services.push({id:uid(),name:'New service',price:0,dur:30});save();render();const n=document.querySelectorAll('[data-set=svcName]');const last=n[n.length-1];if(last){last.focus();last.select();}},
  delSvc:(el,id)=>{if(S.services.length<2)return toast('Keep at least one service');S.services=S.services.filter(s=>s.id!==id);save();render();},
  addStaff:()=>{S.staff.push({id:uid(),name:'New barber',pay:'commission',rate:40,wage:0});save();render();},
  delStaff:(el,id)=>{if(!confirm('Remove this barber? Past records stay.'))return;S.staff=S.staff.filter(s=>s.id!==id);save();render();},
  export:doExport,import:()=>$('#importFile').click(),
  sample:()=>{if(hasSync()&&Sync.signedIn())return toast('Sign out first — sample data would mix with your real data');if(!confirm('Replace everything with sample data?'))return;S=sampleData();save();UI.date=today();render();},
  wipe:()=>{if(!confirm(hasSync()&&Sync.signedIn()?'Erase all bookings, money and settings on EVERY phone signed in to this shop?':'Erase all bookings, money and settings on this phone?'))return;S=baseData();save();UI.date=today();render();toast('Fresh start');},
  startOwn:()=>{if(!confirm('Clear the sample data and start with your own?'))return;S=baseData();save();UI.date=today();UI.tab='settings';render();toast('Set your shop name, prices and team');},
  voice:openVoice,mic:toggleMic,
  sendCmd:()=>{const i=$('#cmdText'),v=i&&i.value.trim();if(v){runCommand(v);i.value='';}},
  example:el=>runCommand(el.dataset.t),
  closeSheet:closeSheet};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn)fn(el,el.dataset.id);});
document.addEventListener('change',e=>{
  const el=e.target;if(el.id==='importFile')return doImport(el);
  const k=el.dataset.set;if(!k)return;const id=el.dataset.id,v=el.type==='checkbox'?el.checked:el.value;
  const sv=id&&S.services.find(s=>s.id===id),st=id&&S.staff.find(s=>s.id===id);
  const num=x=>Math.max(0,parseFloat(x)||0);
  switch(k){case'shop':S.shop=v.trim()||'My Barbershop';break;case'svcName':sv.name=v.trim()||sv.name;el.value=sv.name;break;case'svcPrice':sv.price=num(v);el.value=sv.price;break;case'svcDur':sv.dur=+v||30;break;
    case'stName':st.name=v.trim()||st.name;el.value=st.name;break;case'stPay':st.pay=v;break;case'stRate':st.rate=Math.min(100,num(v));el.value=st.rate;break;case'stWage':st.wage=num(v);el.value=st.wage;break;
    case'open':case'close':{const o=k==='open'?v:S.hours.open,c=k==='close'?v:S.hours.close;
      if(toMin(c)<=toMin(o)){el.value=S.hours[k];return toast('Closing time must be after opening time');}
      S.hours.open=o;S.hours.close=c;break;}
    case'slot':S.hours.slot=+v;break;case'voiceReply':S.voiceReply=v;break;}
  save();if(k==='stPay'||k==='shop')render();toast('Saved');});

/* ---------- start ---------- */
load();render();
// Refresh every minute; after midnight, move "today" along so the app doesn't stay stuck on yesterday.
let lastDay=today();
setInterval(()=>{const T=today();
  if(T!==lastDay){if(UI.date===lastDay)UI.date=T;if(UI.tillDate===lastDay)UI.tillDate=T;if(UI.staffWeek===weekStart(lastDay))UI.staffWeek=weekStart(T);lastDay=T;}
  if(UI.tab==='today'&&!$('#sheet').classList.contains('open')&&!document.activeElement.matches('input,select'))render();},60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="sync.js"></script>
</body>
</html>
